name: Sync upstream

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'afsozer/PixelBoard'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MORPHE_PAT: ${{ secrets.MORPHE_PAT }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/Akshayykadam/PixelBoard.git

      - name: Fetch upstream
        run: git fetch --no-tags upstream main

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has no commits that are missing here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            {
              echo "Upstream commits to bring in:"
              echo
              git log --oneline HEAD..upstream/main
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect packages token
        id: token
        run: |
          if [ -n "$MORPHE_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.new == 'true'
        run: |
          git switch -c upstream-sync
          if git merge --no-edit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/conflicts.txt"
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.merge.outputs.clean == 'true' && steps.token.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.merge.outputs.clean == 'true' && steps.token.outputs.present == 'true'
        uses: android-actions/setup-android@v4

      - name: Run tests
        id: tests
        if: steps.merge.outputs.clean == 'true' && steps.token.outputs.present == 'true'
        working-directory: pixelboard-patches
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PAT }}
        run: ./gradlew test --no-daemon

      - name: Note skipped validation
        if: steps.merge.outputs.clean == 'true' && steps.token.outputs.present == 'false'
        run: echo "MORPHE_PAT secret is missing, so the merge was not built or tested." >> "$GITHUB_STEP_SUMMARY"

      - name: Push merge to main
        if: steps.merge.outputs.clean == 'true'
        run: |
          git switch main
          git merge --ff-only upstream-sync
          git push origin main
          echo "Merged upstream into main." >> "$GITHUB_STEP_SUMMARY"

      - name: Report conflict
        if: steps.merge.outputs.clean == 'false'
        run: |
          {
            echo "Upstream sync could not merge cleanly. Resolve locally:"
            echo
            echo '```'
            echo "git fetch upstream"
            echo "git switch -c upstream-sync main"
            echo "git merge upstream/main   # resolve the files below"
            echo '```'
            echo
            echo "Conflicting files:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
          } > "$RUNNER_TEMP/issue.md"

          gh label create upstream-sync --color BFD4F2 --description "Automatic upstream merge" --force
          existing=$(gh issue list --label upstream-sync --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create \
              --title "Upstream sync conflict" \
              --label upstream-sync \
              --body-file "$RUNNER_TEMP/issue.md"
          fi
          echo "Conflicts reported in the upstream-sync issue." >> "$GITHUB_STEP_SUMMARY"
          exit 1
